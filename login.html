<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register and Login - MDT312 Assignment</title>
    <!-- เชื่อมโยง External CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container nav-container">
            <h1 class="logo">Auth System</h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">หน้าแรก Portfolio</a></li>
                    <li><a href="login.html" class="active">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="profile-section" style="display: block; max-width: 500px; margin: 40px auto;">
            <h2>เข้าสู่ระบบ / สมัครสมาชิก</h2>
            <p class="subtitle">ระบบจัดการผู้ใช้งานด้วย JavaScript และ Local Storage</p>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

            <form id="loginForm" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label for="username" style="display: block; margin-bottom: 5px; font-weight: 500; color: #2c3e50;">ชื่อผู้ใช้งาน (Username)</label>
                    <input type="text" id="username" name="username" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Prompt', sans-serif;">
                </div>

                <div>
                    <label for="password" style="display: block; margin-bottom: 5px; font-weight: 500; color: #2c3e50;">รหัสผ่าน (Password)</label>
                    <input type="password" id="password" name="password" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Prompt', sans-serif;">
                </div>

                <button type="submit" class="btn-small" style="padding: 12px; font-size: 1rem; border: none; cursor: pointer; margin-top: 10px;">เข้าสู่ระบบ</button>
            </form>

            <div style="margin-top: 25px; text-align: center;">
                <p style="font-size: 0.9rem; color: #666;">ยังไม่มีบัญชีผู้ใช้? <a href="#" style="color: #3498db; text-decoration: none;">สมัครสมาชิกที่นี่</a></p>
            </div>

            <div style="margin-top: 30px; text-align: center;">
                <a href="index.html" class="btn-small" style="padding: 8px 16px; background-color: #7f8c8d;">&larr; กลับหน้าหลัก Portfolio</a>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Nattawut Jehma | MDT312 Web Programming</p>
        </div>
    </footer>

    <!-- เชื่อมโยง External JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
